# ============================================================
# application.properties — Backend Despachos (Spring Boot)
# Las variables de entorno se inyectan desde docker-compose
# o desde los Secrets de GitHub Actions en EC2.
# ============================================================

# Servidor
server.port=${SERVER_PORT:8081}

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:despachos_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:despachos_user}
spring.datasource.password=${DB_PASS:despachos_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Actuator (health check para Docker HEALTHCHECK)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Perfil activo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
